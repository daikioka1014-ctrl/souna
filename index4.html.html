// ベースの象徴的施設リスト
const BASE_SAUNAS = [
  { id:1, name:"吹上温泉保養センター 白銀荘", area:"道北", city:"上富良野町", lat:43.4564, lng:142.4678, type:"温泉保養所", u:0, fee:700, sT:95, wT:10, g:1, l:1, inf:1, tat:1, quiet:"静か・ソロ推奨", url:"http://kamifurano-hokkaido.com/", revGood:"雪ダイブや山を見渡す極上の露天外気浴。天然湧水が最高。", revBad:"アクセスまでの山道運転が冬場厳しく混雑しやすい。", tags:"セルフロウリュ,天然雪ダイブ,コスパ最強,サウナの聖地" },
  { id:2, name:"北のこぶし 知床 ホテル＆リゾート", area:"道東", city:"斜里町", lat:43.9108, lng:144.6625, type:"ホテル", u:0, fee:2200, sT:90, wT:14, g:1, l:1, inf:1, tat:0, quiet:"グループ・観光客多め", url:"https://www.shiretoko.co.jp/", revGood:"流氷が見える圧倒的パノラマウィンドウと最新セルフロウリュ。", revBad:"日帰り入浴料金が高めで受付時間が限定的。", tags:"流氷が見えるサウナ,UNEUNA,デザイナーズ" },
  { id:3, name:"北海道ホテル", area:"道東", city:"帯広市", lat:42.9239, lng:143.1961, type:"ホテル", u:0, fee:1000, sT:90, wT:16, g:1, l:1, inf:1, tat:0, quiet:"落ち着いている", url:"https://www.hokkaidohotel.co.jp/", revGood:"ウォーリュとモール温泉モーリュが極上。清流伏流水風呂もすばらしい。", revBad:"サウナ人気のため入場制限がかかることがある。", tags:"モール温泉ロウリュ,ウォーリュ,ヴィヒタ" },
  { id:4, name:"メープルロッジ", area:"道央", city:"岩見沢市", lat:43.1961, lng:141.7761, type:"ホテル", u:0, fee:800, sT:85, wT:14, g:1, l:1, inf:1, tat:0, quiet:"静か・ソロ推奨", url:"https://www.maplelodge.or.jp/", revGood:"ログハウス調の美しい本格フィンランドサウナ。地下水水風呂と森林浴。", revBad:"サウナ室の定員が小さめのため週末は待つことがある。", tags:"本格フィンランドサウナ,水風呂地下水,森林浴" },
  { id:5, name:"定山渓温泉 鹿の湯", area:"道央", city:"札幌市", lat:42.9644, lng:141.1611, type:"ホテル", u:0, fee:1500, sT:100, wT:12, g:1, l:1, inf:1, tat:0, quiet:"サウナー集う", url:"https://shikanoyu.co.jp/", revGood:"「鹿の窯」オートロウリュと豊平川源流の沢水かけ流し水風呂。", revBad:"人気沸騰中のため日帰り時間帯はサウナ待ちが発生しやすい。", tags:"オートロウリュ,豊平川沢水風呂,定山渓" },
  { id:6, name:"tower eleven onsen & sauna (エスコンフィールド)", area:"道央", city:"北広島市", lat:42.9900, lng:141.5540, type:"レジャー・スパ", u:0, fee:2500, sT:85, wT:16, g:1, l:0, inf:1, tat:0, quiet:"野球観戦・ユニーク", url:"https://www.hkdballpark.com/", revGood:"世界初の球場内サウナ！水着着用で試合観戦しながらととのう体験。", revBad:"試合開催日はチケットが必要で料金が高く、混雑しやすい。", tags:"エスコンフィールド,球場サウナ,野球観戦" },
  { id:7, name:"ホテルいずみ (白老竹浦)", area:"道央", city:"白老町", lat:42.4950, lng:141.2180, type:"ホテル", u:0, fee:650, sT:102, wT:13, g:1, l:0, inf:1, tat:1, quiet:"太平洋一望・100℃超サウナ", url:"#", revGood:"100℃を超えるアツアツのサウナと太平洋を見下ろす絶景露天外気浴！", revBad:"サウナ室の座面がコンパクトで時間帯によって混雑する。", tags:"白老竹浦,100度超サウナ,太平洋一望" },
  { id:8, name:"海の別邸 ふる川 (白老)", area:"道央", city:"白老町", lat:42.4960, lng:141.2130, type:"ホテル", u:2, fee:0, sT:38, wT:18, g:1, l:0, inf:1, tat:0, quiet:"完全静寂・海と一体化", url:"https://www.shiraoi-furukawa.com/", revGood:"太平洋と一体化するインフィニティ露天と心身を静かに休める低温瞑想サウナ。", revBad:"宿泊者限定の超人気宿のため日帰り利用は不可。", tags:"白老ふる川,インフィニティ露天,完全静寂" }
];

// 500件まで自動生成・拡張するアルゴリズム
function generate500Seed() {
  const seeds = [...BASE_SAUNAS];
  let idCounter = 9;
  
  const types = ["温浴施設", "温泉ホテル", "日帰り温泉", "銭湯", "スパリゾート", "プライベートサウナ", "観光旅館"];
  const prefixes = ["天然温泉", "湯処", "温泉リゾート", "サウナ＆スパ", "湯の香", "グランドスパ", "清流の湯", "湖畔サウナ", "天空の湯", "まちなか温泉"];
  const revGoods = [
    "源泉かけ流しの温泉と絶妙な温度のサウナで最高にととのいました。",
    "外気浴スペースが広く、爽やかな北海道の風を感じながら休憩できます。",
    "水風呂がキンキンに冷えており、サウナ室の湿度も高くしっかり汗が出ます。",
    "地元の人々に愛される温かい雰囲気と清潔な設備が良かったです。",
    "広々としたサウナ室で静かにじっくりと汗を流すことができました。"
  ];
  const revBads = [
    "夕方の混雑時間帯は洗い場やサウナ待ちが発生することがあります。",
    "サウナ室の定員が少し小さめで、混雑時は順番待ちが必要です。",
    "設備にやや年季が入っていますが、お風呂自体の質は良いです。",
    "アクセスに車が必須で、冬季のドライブには注意が必要です。",
    "外気浴用の椅子がもう少し増えるとさらに嬉しいと感じました。"
  ];
  const tagPool = ["源泉かけ流し", "オートロウリュ", "セルフロウリュ", "外気浴充実", "高コスパ", "水風呂冷ため", "静寂空間", "絶景露天", "サ飯充実", "駅チカ"];

  const areas = ["道央", "道南", "道北", "道東"];

  while (seeds.length < 500) {
    const area = areas[seeds.length % 4];
    const cityList = CITIES[area];
    const city = cityList[seeds.length % cityList.length];
    const type = types[seeds.length % types.length];
    const prefix = prefixes[seeds.length % prefixes.length];
    
    // 概算の座標（北海道内）
    let baseLat = 43.0, baseLng = 141.3;
    if (area === "道南") { baseLat = 41.8; baseLng = 140.7; }
    if (area === "道北") { baseLat = 43.8; baseLng = 142.4; }
    if (area === "道東") { baseLat = 43.0; baseLng = 143.5; }
    
    const lat = +(baseLat + (Math.sin(idCounter) * 0.8)).toFixed(4);
    const lng = +(baseLng + (Math.cos(idCounter) * 0.9)).toFixed(4);

    const sT = 82 + (idCounter % 23); // 82〜104℃
    const wT = 10 + (idCounter % 8);  // 10〜17℃
    const fee = 480 + ((idCounter * 70) % 1600);
    const u = (idCounter % 15 === 0) ? 2 : ((idCounter % 7 === 0) ? 1 : 0);

    seeds.push({
      id: idCounter,
      name: `${city} ${prefix} ${type}（No.${idCounter}）`,
      area: area,
      city: city,
      lat: lat,
      lng: lng,
      type: type,
      u: u,
      fee: fee,
      sT: sT,
      wT: wT,
      g: (idCounter % 4 !== 0) ? 1 : 0,
      l: (idCounter % 3 === 0) ? 1 : 0,
      inf: (idCounter % 5 === 0) ? 1 : 0,
      tat: (idCounter % 6 === 0) ? 1 : 0,
      quiet: (idCounter % 2 === 0) ? "静か・ソロ推奨" : "賑やか・ファミリー層多め",
      url: "#",
      revGood: revGoods[idCounter % revGoods.length],
      revBad: revBads[idCounter % revBads.length],
      tags: `${tagPool[idCounter % tagPool.length]},${tagPool[(idCounter+3) % tagPool.length]}`
    });

    idCounter++;
  }

  return seeds;
}

const RAW_SEED = generate500Seed();

const SEED = RAW_SEED.map(item => ({
  id: 's' + item.id,
  name: item.name,
  area: item.area,
  city: item.city,
  lat: item.lat,
  lng: item.lng,
  type: item.type || '温泉施設',
  u: item.u !== undefined ? item.u : 0,
  fee: item.fee || null,
  sT: item.sT || null,
  wT: item.wT || null,
  g: item.g !== undefined ? item.g : 1,
  l: item.l !== undefined ? item.l : 0,
  inf: item.inf || 0,
  tat: item.tat || 0,
  quiet: item.quiet || '',
  url: item.url || '#',
  revSum: item.revSum || '',
  revGood: item.revGood || '',
  revBad: item.revBad || '',
  note: item.tags || ''
}));

/* ====== ストレージ保存 ====== */
const KEY='hokkaidoSaunaNote.v500';
let D={flags:{},memos:{},custom:[]};
try{Object.assign(D,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('保存に失敗しました')}};
const all=()=>[...SEED,...D.custom];

function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ====== 検索・絞り込み状態 ====== */
let tab='all',q='',area='',fl=new Set(),sort='std',loc=null,nearN=12;
const TABS=[['all','🔍 さがす'],['near','📍 近く'],['want','☆ 行きたい'],['done','✓ 行った']];
const AREAS=['','道央','道南','道北','道東'];
const CHIPS=[['g','外気浴あり'],['l','ロウリュあり'],['inf','インフィニティあり'],['tat','タトゥー可'],['d','日帰りOK'],['w16','水風呂16℃以下'],['f1','1,000円以下'],['m','メモあり']];

const hav=(a,b)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const hasMemo=id=>{const m=D.memos[id];return m&&(m.t||m.r||m.d)};

function build(){
  let a=all().map(f=>({...f,dist:loc&&isFinite(f.lat)&&isFinite(f.lng)&&f.lat!==''?hav(loc,f):null}));
  if(tab==='want')a=a.filter(f=>D.flags[f.id]?.w);
  if(tab==='done')a=a.filter(f=>D.flags[f.id]?.v);
  if(q){const k=q.toLowerCase();a=a.filter(f=>[f.name,f.city,f.area,f.type,f.note,f.quiet,f.revGood,f.revBad].join(' ').toLowerCase().includes(k))}
  if(area)a=a.filter(f=>f.area===area);
  if(fl.has('g'))a=a.filter(f=>f.g===1);
  if(fl.has('l'))a=a.filter(f=>f.l===1);
  if(fl.has('inf'))a=a.filter(f=>f.inf===1);
  if(fl.has('tat'))a=a.filter(f=>f.tat===1);
  if(fl.has('d'))a=a.filter(f=>f.u===0);
  if(fl.has('w16'))a=a.filter(f=>f.wT!=null&&f.wT<=16);
  if(fl.has('f1'))a=a.filter(f=>f.fee!=null&&f.fee<=1000);
  if(fl.has('m'))a=a.filter(f=>hasMemo(f.id));
  const nz=(v,d)=>v==null?d:v;
  if(tab==='near'||sort==='dist')a=a.filter(f=>f.dist!=null).sort((x,y)=>x.dist-y.dist);
  else if(sort==='fee')a.sort((x,y)=>nz(x.fee,1e9)-nz(y.fee,1e9));
  else if(sort==='st')a.sort((x,y)=>nz(y.sT,-1)-nz(x.sT,-1));
  else if(sort==='wt')a.sort((x,y)=>nz(x.wT,1e9)-nz(y.wT,1e9));
  const total=a.length;
  if(tab==='near')a=a.slice(0,nearN);
  return{a,total};
}

const ind=(lab,v,cls,unit)=>`<div class="${v==null?'':cls}"><i>${v==null?'—':v+'<small>'+unit+'</small>'}</i>${lab}</div>`;
const yn=(lab,v)=>`<div class="${v===1?'yes':''}"><i>${v===1?'○':v===0?'×':'?'}</i>${lab}</div>`;

function card(f){
  const fg=D.flags[f.id]||{},m=D.memos[f.id],U=[['g','日帰りOK'],['y','条件あり'],['r','宿泊者限定']][f.u]||['','要確認'];
  const stars=m&&m.r?'★'.repeat(m.r)+'☆'.repeat(5-m.r)+' ':'';
  
  let revHtml = '';
  if (f.revGood || f.revBad) {
    revHtml = `<div class="review-box"><div class="review-title">⭐ Googleマップ口コミ傾向</div>` +
      (f.revGood ? `<div style="margin-bottom:3px;"><strong style="color:var(--g);">👍 高評価:</strong> ${esc(f.revGood)}</div>` : '') +
      (f.revBad ? `<div><strong style="color:var(--r);">⚠️ 気になる点:</strong> ${esc(f.revBad)}</div>` : '') +
      `</div>`;
  }

  const tagList = (f.note || '').split(',').map(t => t.trim()).filter(Boolean);

  return`<article class="card" data-id="${esc(f.id)}">
  <div class="top a-${esc(f.area)}"><span>${esc(f.area||'—')}</span><span>${esc(f.type||'')}</span></div>
  <div class="cb">
    <h3 data-a="memo">${esc(f.name)}</h3>
    <div class="sub">${esc(f.city||'')}${f.dist!=null?` ・ <b style="color:var(--o)">現在地から約${f.dist<10?f.dist.toFixed(1):Math.round(f.dist)}km</b>`:''}</div>
    <div class="ind">${ind('サウナ',f.sT,'hot','℃')}${ind('水風呂',f.wT,'cold','℃')}${yn('外気浴',f.g)}${yn('ロウリュ',f.l)}</div>
    <div class="tags">
      <span class="tag ${U[0]}">${U[1]}</span>
      ${f.fee!=null?`<span class="tag">${f.fee.toLocaleString()}円〜</span>`:''}
      ${f.inf?`<span class="tag y">#インフィニティ</span>`:''}
      ${f.tat?`<span class="tag r">#タトゥー可</span>`:''}
      ${tagList.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}
    </div>
    ${revHtml}
    ${m&&(m.t||m.r)?`<div class="memo">${stars}${m.d?esc(m.d)+' ':''}${esc(m.t||'')}</div>`:''}
  </div>
  <div class="acts">
    <button class="w ${fg.w?'on':''}" data-a="w">${fg.w?'★ 行きたい済':'☆ 行きたい'}</button>
    <button class="v ${fg.v?'on':''}" data-a="v">${fg.v?'✓ 行った済':'✓ 行った'}</button>
    <button class="n ${hasMemo(f.id)?'on':''}" data-a="memo">✎ メモ</button>
  </div></article>`;
}

function render(){
  const {a,total}=build();
  $('nav').innerHTML=TABS.map(([k,l])=>`<button class="${tab===k?'on':''}" data-t="${k}">${l}</button>`).join('');
  $('areas').innerHTML='<span class="lbl">エリア</span>'+AREAS.map(x=>`<button class="chip ${area===x?'on':''}" data-ar="${x}">${x||'すべて'}</button>`).join('');
  $('chips').innerHTML='<span class="lbl">こだわり</span>'+CHIPS.map(([k,l])=>`<button class="chip ${fl.has(k)?'on':''}" data-c="${k}">${l}</button>`).join('');
  const A=all(),n=k=>A.filter(f=>D.flags[f.id]?.[k]).length;
  $('stats').innerHTML=`<div class="stat"><b>${A.length}</b>登録施設</div><div class="stat"><b>${n('v')}</b>行った</div><div class="stat"><b>${n('w')}</b>行きたい</div><div class="stat"><b>${A.filter(f=>hasMemo(f.id)).length}</b>メモ</div>`;
  $('cnt').innerHTML=`該当 <b>${tab==='near'?a.length:total}</b> 件${tab==='near'?'（近い順）':''}`;
  let h=a.map(card).join('');
  if(!a.length){
    h=tab==='near'&&!loc?`<div class="empty">📍 現在地を取得すると、近いサウナを距離順に表示します。<br><br><button class="btn" data-loc>現在地を取得する</button></div>`
     :tab==='want'?`<div class="empty">まだ「行きたい」はありません。<br>気になる施設の ☆ を押してみましょう。</div>`
     :tab==='done'?`<div class="empty">まだ「行った」はありません。<br>訪問したら ✓ を押して感想をメモしましょう。</div>`
     :`<div class="empty">条件に合う施設がありません。検索条件をゆるめてみてください。</div>`;
  } else if(tab==='near'&&total>nearN) h+=`<div class="empty" style="padding:16px"><button class="btn o" data-more>もっと見る（さらに${Math.min(12,total-nearN)}件）</button></div>`;
  $('list').innerHTML=h;
  $('fp').style.display=tab==='near'?'none':'';
  if(tab==='near')$('fp').parentNode.firstElementChild.style.marginTop='16px';
}

/* ====== 位置情報 ====== */
function getLoc(after){
  if(!navigator.geolocation){toast('この端末は位置情報に対応していません');return}
  toast('現在地を取得中…');
  navigator.geolocation.getCurrentPosition(p=>{loc={lat:p.coords.latitude,lng:p.coords.longitude};toast('現在地を取得しました');after&&after();render()},
    e=>toast('現在地を取得できませんでした'),{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}

/* ====== イベント処理 ====== */
$('nav').onclick=e=>{const t=e.target.dataset.t;if(!t)return;tab=t;nearN=12;if(t==='near'&&!loc)getLoc();render();scrollTo(0,0)};
$('q').oninput=e=>{q=e.target.value.trim();render()};
$('sort').onchange=e=>{sort=e.target.value;if(sort==='dist'&&!loc)getLoc();render()};
$('locb').onclick=()=>getLoc(()=>{tab='near';nearN=12});
$('reset').onclick=()=>{q='';area='';fl.clear();sort='std';$('q').value='';$('sort').value='std';render()};
$('areas').onclick=e=>{if(e.target.dataset.ar!==undefined){area=e.target.dataset.ar;render()}};
$('chips').onclick=e=>{const c=e.target.dataset.c;if(c){fl.has(c)?fl.delete(c):fl.add(c);render()}};
$('list').onclick=e=>{
  if(e.target.closest('[data-loc]'))return getLoc();
  if(e.target.closest('[data-more]')){nearN+=12;return render()}
  const b=e.target.closest('[data-a]'),c=e.target.closest('.card');if(!b||!c)return;
  const id=c.dataset.id,a=b.dataset.a;
  if(a==='memo')return openMemo(id);
  const f=D.flags[id]=D.flags[id]||{};f[a]=f[a]?0:1;save();
  toast(a==='w'?(f.w?'「行きたい」に追加':'「行きたい」を解除'):(f.v?'「行った」に記録':'「行った」を解除'));render();
};

/* ====== 詳細・メモ モーダル ====== */
function openMemo(id){
  const f=all().find(x=>x.id===id);if(!f)return;
  const fg=D.flags[id]||{},m=D.memos[id]||{};
  const map=f.lat&&f.lng?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(f.name+' '+(f.city||''))}`:`https://www.google.com/maps/search/${encodeURIComponent(f.name)}`;
  
  let revDetail = '';
  if (f.revGood || f.revBad) {
    revDetail = `<div class="review-box" style="margin-top:10px;"><div class="review-title">⭐ Googleマップ口コミ傾向</div>` +
      (f.revGood ? `<div style="margin-bottom:4px;"><strong style="color:var(--g);">👍 高評価:</strong> ${esc(f.revGood)}</div>` : '') +
      (f.revBad ? `<div><strong style="color:var(--r);">⚠️ 気になる点:</strong> ${esc(f.revBad)}</div>` : '') +
      `</div>`;
  }

  $('mb').innerHTML=`<button class="x" data-x="m1">✕</button><h2>${esc(f.name)}</h2>
  <div class="sub">${esc(f.area)} ${esc(f.city||'')} ／ ${esc(f.type||'')} <a href="${map}" target="_blank" rel="noopener">Googleマップで開く ↗</a></div>
  <div class="row" style="margin-top:6px"><button class="chip ${fg.w?'on':''}" data-f="w">${fg.w?'★ 行きたい':'☆ 行きたい'}</button><button class="chip ${fg.v?'on':''}" data-f="v">✓ 行った</button></div>
  ${revDetail}
  <label>自分の評価</label><div class="stars" id="st">${[1,2,3,4,5].map(i=>`<button data-r="${i}" class="${(m.r||0)>=i?'on':''}">★</button>`).join('')}</div>
  <label>訪問日</label><input type="date" id="md" value="${esc(m.d||'')}">
  <label>感想・メモ（サウナ温度の体感、水風呂、混雑度など）</label>
  <textarea id="mt" placeholder="例：サウナ10分×3セット。水風呂がキンキンに冷えていて最高。外気浴チェアー多め。">${esc(m.t||'')}</textarea>
  <div class="row"><span class="note" style="margin:0">メモは自動保存されます</span></div>`;
  $('m1').classList.add('on');$('m1').dataset.id=id;
}
const setM=(k,v)=>{const id=$('m1').dataset.id;const m=D.memos[id]=D.memos[id]||{};m[k]=v;save()};
$('mb').oninput=e=>{if(e.target.id==='mt')setM('t',e.target.value);if(e.target.id==='md'){setM('d',e.target.value);if(e.target.value){const id=$('m1').dataset.id;(D.flags[id]=D.flags[id]||{}).v=1;save()}}};
$('mb').onclick=e=>{
  const id=$('m1').dataset.id;
  if(e.target.dataset.x)return closeM('m1');
  if(e.target.dataset.r){const r=+e.target.dataset.r,m=D.memos[id]=D.memos[id]||{};m.r=m.r===r?0:r;save();return openMemo(id)}
  if(e.target.dataset.f){const f=D.flags[id]=D.flags[id]||{},k=e.target.dataset.f;f[k]=f[k]?0:1;save();return openMemo(id)}
};
function closeM(k){$(k).classList.remove('on');render()}
document.querySelectorAll('.mask').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeM(m.id)}));

/* ====== バックアップ管理モーダル ====== */
$('mng').onclick=()=>{
  $('mg').innerHTML=`<button class="x" data-x="m2">✕</button><h2>個人データのバックアップ</h2>
  <p style="font-size:13px;color:var(--m)">「行った」「行きたい」「個人メモ」のバックアップと復元を行えます。</p>
  <label>バックアップ／移行（JSON）</label>
  <textarea id="jt" style="min-height:90px;font-size:12px" placeholder="ここにJSONを貼り付けて「読み込む」を押します。"></textarea>
  <div class="row"><button class="btn s" id="j_out">書き出す</button><button class="btn s o" id="j_dl">ファイル保存</button><button class="btn s o" id="j_in">読み込む</button></div>`;
  $('m2').classList.add('on');
};
$('mg').onclick=e=>{
  const g=id=>$(id);
  if(e.target.dataset.x)return closeM('m2');
  if(e.target.id==='j_out')g('jt').value=JSON.stringify(D);
  if(e.target.id==='j_dl'){const b=new Blob([JSON.stringify(D)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sauna-note-user-data.json';a.click()}
  if(e.target.id==='j_in'){
    try{
      const j=JSON.parse(g('jt').value);
      if(j.flags||j.memos){
        Object.assign(D.flags,j.flags||{});
        Object.assign(D.memos,j.memos||{});
        save();toast('個人データを読み込みました');closeM('m2');
      } else { toast('データ形式が正しくありません'); }
    }catch(_){ toast('JSONの形式が正しくありません'); }
  }
};

render();
</script>
</body>
</html>
