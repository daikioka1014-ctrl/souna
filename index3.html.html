const GK_DEF=''; // ここにAPIキーを直接書いてもOK
const gkey=()=>{try{return localStorage.getItem('hokkaidoSaunaNote.gkey')||GK_DEF}catch(e){return GK_DEF}};

let gLoad=null;
window.gm_authFailure=()=>{gLoad=null;const b=document.getElementById('rv');if(b)b.innerHTML='<div class="note">APIキーが無効、または許可されていません。</div>'};
function gmaps(){
  if(window.google&&google.maps&&google.maps.importLibrary)return Promise.resolve();
  if(gLoad)return gLoad;
  gLoad=new Promise((res,rej)=>{
    window.__gmInit=()=>res();
    const s=document.createElement('script');
    s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(gkey())+'&v=weekly&language=ja&region=JP&loading=async&callback=__gmInit';
    s.onerror=()=>{gLoad=null;rej(new Error('load'))};document.head.appendChild(s);
  });return gLoad;
}
async function loadReviews(id){
  const box=$('rv'),f=all().find(x=>x.id===id);if(!box||!f)return;
  if(!gkey()){box.innerHTML='<div class="note">リアルタイム口コミ取得にはGoogle Maps APIキーが必要です。「⚙ 施設追加・データ管理」で設定してください。</div>';return}
  box.innerHTML='<div class="note">Googleから読み込み中…</div>';
  try{
    await gmaps();
    const {Place}=await google.maps.importLibrary('places');
    const req={textQuery:f.name+' '+(f.city||'')+' 北海道',fields:['id'],maxResultCount:1,language:'ja',region:'jp'};
    if(f.lat&&isFinite(f.lat)&&isFinite(f.lng))req.locationBias={center:{lat:f.lat,lng:f.lng},radius:30000};
    const {places}=await Place.searchByText(req);
    if(!places.length){box.innerHTML='<div class="note">Googleマップで該当施設が見つかりませんでした。</div>';return}
    const p=places[0];
    await p.fetchFields({fields:['displayName','rating','userRatingCount','reviews','googleMapsURI']});
    const R=p.reviews||[];
    const one=r=>`<div class="memo" style="display:block;margin:6px 0"><b style="color:#f5a623">${'★'.repeat(r.rating||0)}</b> ${esc(r.authorAttribution?.displayName||'')} <span style="color:#999">${esc(r.relativePublishTimeDescription||'')}</span><br>${esc(r.text||'（本文なし）')}</div>`;
    const grp=(t,c,a)=>a.length?`<div class="lbl" style="margin-top:10px;color:${c}">${t}（${a.length}件）</div>${a.map(one).join('')}`:'';
    box.innerHTML=`<div style="font-size:13px">Google上の施設名：<b>${esc(p.displayName||'')}</b> <b style="color:#f5a623">★${p.rating??'-'}</b>（${p.userRatingCount??0}件）</div>
      ${grp('👍 良い口コミ（★4〜5）','var(--g)',R.filter(r=>r.rating>=4))}${grp('😐 ふつう（★3）','var(--m)',R.filter(r=>r.rating===3))}${grp('👎 悪い口コミ（★1〜2）','var(--r)',R.filter(r=>r.rating<=2))}
      ${R.length?'':'<div class="note">口コミがありません。</div>'}
      <div class="note">Googleが返す最大5件の口コミのみ表示します。${p.googleMapsURI?` <a href="${esc(p.googleMapsURI)}" target="_blank" rel="noopener">Googleマップですべて見る ↗</a>`:''} Powered by Google</div>`;
  }catch(e){box.innerHTML='<div class="note">口コミを取得できませんでした（'+esc(e.message||e)+'）。</div>'}
}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}

/* ====== 状態 ====== */
let tab='all',q='',area='',fl=new Set(),sort='std',loc=null,nearN=6;
const TABS=[['all','🔍 さがす'],['near','📍 近く'],['want','☆ 行きたい'],['done','✓ 行った']];
const AREAS=['','道央','道南','道北','道東'];
const CHIPS=[['g','外気浴あり'],['l','ロウリュあり'],['inf','インフィニティあり'],['tat','タトゥー可'],['d','日帰りOK'],['w16','水風呂16℃以下'],['f1','1,000円以下'],['m','メモあり']];

const hav=(a,b)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const hasMemo=id=>{const m=D.memos[id];return m&&(m.t||m.r||m.d)};

function build(){
  let a=all().map(f=>({...f,dist:loc&&isFinite(f.lat)&&isFinite(f.lng)&&f.lat!==''?hav(loc,f):null}));
  if(tab==='want')a=a.filter(f=>D.flags[f.id]?.w);
  if(tab==='done')a=a.filter(f=>D.flags[f.id]?.v);
  if(q){const k=q.toLowerCase();a=a.filter(f=>[f.name,f.city,f.area,f.type,f.note,f.quiet,f.revSum,f.revGood,f.revBad].join(' ').toLowerCase().includes(k))}
  if(area)a=a.filter(f=>f.area===area);
  if(fl.has('g'))a=a.filter(f=>f.g===1);
  if(fl.has('l'))a=a.filter(f=>f.l===1);
  if(fl.has('inf'))a=a.filter(f=>f.inf===1);
  if(fl.has('tat'))a=a.filter(f=>f.tat===1);
  if(fl.has('d'))a=a.filter(f=>f.u===0);
  if(fl.has('w16'))a=a.filter(f=>f.wT!=null&&f.wT<=16);
  if(fl.has('f1'))a=a.filter(f=>f.fee!=null&&f.fee<=1000);
  if(fl.has('m'))a=a.filter(f=>hasMemo(f.id));
  const nz=(v,d)=>v==null?d:v;
  if(tab==='near'||sort==='dist')a=a.filter(f=>f.dist!=null).sort((x,y)=>x.dist-y.dist);
  else if(sort==='fee')a.sort((x,y)=>nz(x.fee,1e9)-nz(y.fee,1e9));
  else if(sort==='st')a.sort((x,y)=>nz(y.sT,-1)-nz(x.sT,-1));
  else if(sort==='wt')a.sort((x,y)=>nz(x.wT,1e9)-nz(y.wT,1e9));
  const total=a.length;
  if(tab==='near')a=a.slice(0,nearN);
  return{a,total};
}

const ind=(lab,v,cls,unit)=>`<div class="${v==null?'':cls}"><i>${v==null?'—':v+'<small>'+unit+'</small>'}</i>${lab}</div>`;
const yn=(lab,v)=>`<div class="${v===1?'yes':''}"><i>${v===1?'○':v===0?'×':'?'}</i>${lab}</div>`;

function card(f){
  const fg=D.flags[f.id]||{},m=D.memos[f.id],U=[['g','日帰りOK'],['y','条件あり'],['r','宿泊者限定']][f.u]||['','要確認'];
  const stars=m&&m.r?'★'.repeat(m.r)+'☆'.repeat(5-m.r)+' ':'';
  
  // Google口コミ傾向（良い口コミ＆気になる点）の構築
  let revHtml = '';
  if (f.revSum) {
    revHtml = `<div class="review-box"><div class="review-title">⭐ Googleマップ口コミ総括</div>${esc(f.revSum)}</div>`;
  } else if (f.revGood || f.revBad) {
    revHtml = `<div class="review-box"><div class="review-title">⭐ Googleマップ口コミ傾向</div>` +
      (f.revGood ? `<div style="margin-bottom:3px;"><strong style="color:var(--g);">👍 高評価:</strong> ${esc(f.revGood)}</div>` : '') +
      (f.revBad ? `<div><strong style="color:var(--r);">⚠️ 気になる点:</strong> ${esc(f.revBad)}</div>` : '') +
      `</div>`;
  }

  const tagList = (f.note || '').split(',').map(t => t.trim()).filter(Boolean);

  return`<article class="card" data-id="${esc(f.id)}">
  <div class="top a-${esc(f.area)}"><span>${esc(f.area||'—')}</span><span>${esc(f.type||'')}</span></div>
  <div class="cb">
    <h3 data-a="memo">${esc(f.name)}</h3>
    <div class="sub">${esc(f.city||'')}${f.dist!=null?` ・ <b style="color:var(--o)">現在地から約${f.dist<10?f.dist.toFixed(1):Math.round(f.dist)}km</b>`:''}</div>
    <div class="ind">${ind('サウナ',f.sT,'hot','℃')}${ind('水風呂',f.wT,'cold','℃')}${yn('外気浴',f.g)}${yn('ロウリュ',f.l)}</div>
    <div class="tags">
      <span class="tag ${U[0]}">${U[1]}</span>
      ${f.fee!=null?`<span class="tag">${f.fee.toLocaleString()}円〜</span>`:''}
      ${f.inf?`<span class="tag y">#インフィニティ</span>`:''}
      ${f.tat?`<span class="tag r">#タトゥー可</span>`:''}
      ${tagList.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}
    </div>
    ${revHtml}
    ${m&&(m.t||m.r)?`<div class="memo">${stars}${m.d?esc(m.d)+' ':''}${esc(m.t||'')}</div>`:''}
  </div>
  <div class="acts">
    <button class="w ${fg.w?'on':''}" data-a="w">${fg.w?'★ 行きたい済':'☆ 行きたい'}</button>
    <button class="v ${fg.v?'on':''}" data-a="v">${fg.v?'✓ 行った済':'✓ 行った'}</button>
    <button class="n ${hasMemo(f.id)?'on':''}" data-a="memo">✎ メモ</button>
  </div></article>`;
}

function render(){
  const {a,total}=build();
  $('nav').innerHTML=TABS.map(([k,l])=>`<button class="${tab===k?'on':''}" data-t="${k}">${l}</button>`).join('');
  $('areas').innerHTML='<span class="lbl">エリア</span>'+AREAS.map(x=>`<button class="chip ${area===x?'on':''}" data-ar="${x}">${x||'すべて'}</button>`).join('');
  $('chips').innerHTML='<span class="lbl">こだわり</span>'+CHIPS.map(([k,l])=>`<button class="chip ${fl.has(k)?'on':''}" data-c="${k}">${l}</button>`).join('');
  const A=all(),n=k=>A.filter(f=>D.flags[f.id]?.[k]).length;
  $('stats').innerHTML=`<div class="stat"><b>${A.length}</b>登録施設</div><div class="stat"><b>${n('v')}</b>行った</div><div class="stat"><b>${n('w')}</b>行きたい</div><div class="stat"><b>${A.filter(f=>hasMemo(f.id)).length}</b>メモ</div>`;
  $('cnt').innerHTML=`該当 <b>${tab==='near'?a.length:total}</b> 件${tab==='near'?'（近い順）':''}`;
  let h=a.map(card).join('');
  if(!a.length){
    h=tab==='near'&&!loc?`<div class="empty">📍 現在地を取得すると、近いサウナを距離つきで表示します。<br><br><button class="btn" data-loc>現在地を取得する</button></div>`
     :tab==='want'?`<div class="empty">まだ「行きたい」はありません。<br>気になる施設の ☆ を押してみましょう。</div>`
     :tab==='done'?`<div class="empty">まだ「行った」はありません。<br>訪問したら ✓ を押して感想をメモしましょう。</div>`
     :`<div class="empty">条件に合う施設がありません。条件をゆるめてみてください。</div>`;
  } else if(tab==='near'&&total>nearN) h+=`<div class="empty" style="padding:16px"><button class="btn o" data-more>もっと見る（さらに${Math.min(6,total-nearN)}件）</button></div>`;
  $('list').innerHTML=h;
  $('fp').style.display=tab==='near'?'none':'';
  if(tab==='near')$('fp').parentNode.firstElementChild.style.marginTop='16px';
}

/* ====== 位置情報 ====== */
function getLoc(after){
  if(!navigator.geolocation){toast('この端末は位置情報に対応していません');return}
  toast('現在地を取得中…');
  navigator.geolocation.getCurrentPosition(p=>{loc={lat:p.coords.latitude,lng:p.coords.longitude};toast('現在地を取得しました');after&&after();render()},
    e=>toast(e.code===1?'位置情報の利用が許可されていません':'現在地を取得できませんでした'),{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}

/* ====== イベント ====== */
$('nav').onclick=e=>{const t=e.target.dataset.t;if(!t)return;tab=t;nearN=6;if(t==='near'&&!loc)getLoc();render();scrollTo(0,0)};
$('q').oninput=e=>{q=e.target.value.trim();render()};
$('sort').onchange=e=>{sort=e.target.value;if(sort==='dist'&&!loc)getLoc();render()};
$('locb').onclick=()=>getLoc(()=>{tab='near';nearN=6});
$('reset').onclick=()=>{q='';area='';fl.clear();sort='std';$('q').value='';$('sort').value='std';render()};
$('areas').onclick=e=>{if(e.target.dataset.ar!==undefined){area=e.target.dataset.ar;render()}};
$('chips').onclick=e=>{const c=e.target.dataset.c;if(c){fl.has(c)?fl.delete(c):fl.add(c);render()}};
$('list').onclick=e=>{
  if(e.target.closest('[data-loc]'))return getLoc();
  if(e.target.closest('[data-more]')){nearN+=6;return render()}
  const b=e.target.closest('[data-a]'),c=e.target.closest('.card');if(!b||!c)return;
  const id=c.dataset.id,a=b.dataset.a;
  if(a==='memo')return openMemo(id);
  const f=D.flags[id]=D.flags[id]||{};f[a]=f[a]?0:1;save();
  toast(a==='w'?(f.w?'「行きたい」に追加しました':'「行きたい」を外しました'):(f.v?'「行った」に記録しました':'「行った」を外しました'));render();
};

/* ====== 詳細・メモ ====== */
const today=()=>new Date().toISOString().slice(0,10);
function openMemo(id){
  const f=all().find(x=>x.id===id);if(!f)return;
  const fg=D.flags[id]||{},m=D.memos[id]||{};
  const map=f.lat&&f.lng?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(f.name+' '+(f.city||''))}`:`https://www.google.com/maps/search/${encodeURIComponent(f.name)}`;
  
  let revDetail = '';
  if (f.revSum) {
    revDetail = `<div class="review-box" style="margin-top:10px;"><div class="review-title">⭐ Googleマップ口コミ総括</div>${esc(f.revSum)}</div>`;
  } else if (f.revGood || f.revBad) {
    revDetail = `<div class="review-box" style="margin-top:10px;"><div class="review-title">⭐ Googleマップ口コミ傾向</div>` +
      (f.revGood ? `<div style="margin-bottom:4px;"><strong style="color:var(--g);">👍 高評価:</strong> ${esc(f.revGood)}</div>` : '') +
      (f.revBad ? `<div><strong style="color:var(--r);">⚠️ 気になる点:</strong> ${esc(f.revBad)}</div>` : '') +
      `</div>`;
  }

  $('mb').innerHTML=`<button class="x" data-x="m1">✕</button><h2>${esc(f.name)}</h2>
  <div class="sub">${esc(f.area)} ${esc(f.city||'')} ／ ${esc(f.type||'')} <a href="${map}" target="_blank" rel="noopener">地図で開く ↗</a></div>
  <div class="row" style="margin-top:6px"><button class="chip ${fg.w?'on':''}" data-f="w">${fg.w?'★ 行きたい':'☆ 行きたい'}</button><button class="chip ${fg.v?'on':''}" data-f="v">✓ 行った</button></div>
  ${revDetail}
  <label>リアルタイム口コミ取得（Google Places API）</label><div id="rv"><button class="btn s o" data-rv>💬 Googleから最新5件を取得する</button></div>
  <label>自分の評価</label><div class="stars" id="st">${[1,2,3,4,5].map(i=>`<button data-r="${i}" class="${(m.r||0)>=i?'on':''}">★</button>`).join('')}</div>
  <label>訪問日</label><input type="date" id="md" value="${esc(m.d||'')}">
  <label>感想・メモ（サウナ温度の体感、水風呂、混雑、整い度、食事など）</label>
  <textarea id="mt" placeholder="例：10分×3セット。水風呂が冷たくて最高。外気浴の椅子が少なめ。">${esc(m.t||'')}</textarea>
  <div class="row"><span class="note" style="margin:0">入力内容は自動保存されます</span>${id[0]==='u'?'<button class="chip" data-del style="margin-left:auto;color:var(--r)">この施設を削除</button>':''}</div>`;
  $('m1').classList.add('on');$('m1').dataset.id=id;
}
const setM=(k,v)=>{const id=$('m1').dataset.id;const m=D.memos[id]=D.memos[id]||{};m[k]=v;save()};
$('mb').oninput=e=>{if(e.target.id==='mt')setM('t',e.target.value);if(e.target.id==='md'){setM('d',e.target.value);if(e.target.value){const id=$('m1').dataset.id;(D.flags[id]=D.flags[id]||{}).v=1;save()}}};
$('mb').onclick=e=>{
  const id=$('m1').dataset.id;
  if(e.target.dataset.x)return closeM('m1');
  if(e.target.dataset.rv!==undefined)return loadReviews(id);
  if(e.target.dataset.r){const r=+e.target.dataset.r,m=D.memos[id]=D.memos[id]||{};m.r=m.r===r?0:r;save();return openMemo(id)}
  if(e.target.dataset.f){const f=D.flags[id]=D.flags[id]||{},k=e.target.dataset.f;f[k]=f[k]?0:1;save();return openMemo(id)}
  if(e.target.dataset.del&&confirm('この施設を削除しますか？')){D.custom=D.custom.filter(x=>x.id!==id);delete D.flags[id];delete D.memos[id];save();closeM('m1')}
};
function closeM(k){$(k).classList.remove('on');render()}
document.querySelectorAll('.mask').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeM(m.id)}));

/* ====== 管理（追加・バックアップ・インポート） ====== */
$('mng').onclick=()=>{
  $('mg').innerHTML=`<button class="x" data-x="m2">✕</button><h2>施設追加・データ管理</h2>
  <label>施設を追加</label>
  <input id="n_name" placeholder="施設名（必須）">
  <div class="g2" style="margin-top:8px"><input id="n_city" placeholder="市町村（例：白老町）"><select id="n_area" style="padding:9px"><option>道央</option><option>道南</option><option>道北</option><option>道東</option></select></div>
  <div class="g2" style="margin-top:8px"><input id="n_st" type="number" placeholder="サウナ温度 ℃"><input id="n_wt" type="number" step="0.1" placeholder="水風呂温度 ℃"></div>
  <div class="g2" style="margin-top:8px"><input id="n_fee" type="number" placeholder="料金（円）"><input id="n_type" placeholder="種別（銭湯・ホテル等）"></div>
  <div class="row"><label style="margin:0"><input type="checkbox" id="n_g" style="width:auto"> 外気浴</label><label style="margin:0"><input type="checkbox" id="n_l" style="width:auto"> ロウリュ</label><label style="margin:0"><input type="checkbox" id="n_d" style="width:auto" checked> 日帰りOK</label></div>
  <div class="row"><button class="btn s o" id="n_loc">📍 現在地を座標に使う</button><span id="n_ll" class="note" style="margin:0"></span></div>
  <div class="row"><button class="btn" id="n_add">追加する</button></div>
  <hr style="border:0;border-top:1px solid var(--l);margin:18px 0 0">
  <label>Google Maps APIキー（リアルタイム口コミ表示用・この端末にのみ保存）</label>
  <input id="gk" value="${esc(gkey())}" placeholder="AIza... （Places API (New) を有効化したキー）" autocomplete="off">
  <p class="note">キーはNetlifyのURLだけで使えるようリファラ制限をかけてください。</p>
  <hr style="border:0;border-top:1px solid var(--l);margin:14px 0 0">
  <label>バックアップ／データ移行（JSON）</label>
  <textarea id="jt" style="min-height:90px;font-size:12px" placeholder="ここにJSONを貼り付けて「読み込む」。"></textarea>
  <div class="row"><button class="btn s" id="j_out">書き出す</button><button class="btn s o" id="j_dl">ファイル保存</button><button class="btn s o" id="j_in">読み込む</button></div>`;
  $('m2').classList.add('on');
};
let nl=null;
$('mg').onclick=e=>{
  const g=id=>$(id);
  if(e.target.dataset.x)return closeM('m2');
  if(e.target.id==='n_loc'){navigator.geolocation?.getCurrentPosition(p=>{nl={lat:p.coords.latitude,lng:p.coords.longitude};g('n_ll').textContent='座標を取得しました'},()=>toast('取得できませんでした'));}
  if(e.target.id==='n_add'){
    const name=g('n_name').value.trim();if(!name)return toast('施設名を入力してください');
    const nv=id=>g(id).value===''?null:+g(id).value;
    D.custom.push({id:'u'+Date.now(),name,area:g('n_area').value,city:g('n_city').value.trim(),lat:nl?nl.lat:NaN,lng:nl?nl.lng:NaN,type:g('n_type').value.trim(),u:g('n_d').checked?0:1,fee:nv('n_fee'),sT:nv('n_st'),wT:nv('n_wt'),g:g('n_g').checked?1:0,l:g('n_l').checked?1:0,note:'自分で追加'});
    save();nl=null;toast('追加しました');closeM('m2');
  }
  if(e.target.id==='j_out')g('jt').value=JSON.stringify(D);
  if(e.target.id==='j_dl'){const b=new Blob([JSON.stringify(D)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sauna-note-backup.json';a.click()}
  if(e.target.id==='j_in')importJ(g('jt').value);
};
const pick=(o,ks)=>{for(const k of ks)if(o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k];return null};
const num=v=>{if(v==null)return null;const n=parseFloat(String(v).replace(/[^\d.\-]/g,''));return isFinite(n)?n:null};
const bool=v=>v===true||v===1||/^(true|1|○|あり|有|yes)/i.test(String(v||''))?1:(v==null?-1:0);
function importJ(t){
  let j;try{j=JSON.parse(t)}catch(e){return toast('JSONの形式が正しくありません')}
  if(!Array.isArray(j)&&j.custom){
    Object.assign(D.flags,j.flags||{});Object.assign(D.memos,j.memos||{});
    (j.custom||[]).forEach(c=>{if(!D.custom.some(x=>x.id===c.id))D.custom.push(c)});
    save();toast('バックアップを読み込みました');return closeM('m2');
  }
  const arr=Array.isArray(j)?j:(j.facilities||j.data||j.saunas||[]);let n=0;const names=new Set(all().map(f=>f.name));
  arr.forEach((o,i)=>{
    const name=pick(o,['name','名前','施設名','title']);if(!name||names.has(name))return;names.add(name);
    const ar=String(pick(o,['area','エリア','region'])||'');
    const use=String(pick(o,['usage','利用区分','use','status'])||'');
    D.custom.push({id:'u'+Date.now()+'_'+i,name,area:/道央|道北|道東|道南/.test(ar)?ar.match(/道央|道北|道東|道南/)[0]:'道央',city:String(pick(o,['city','address','住所','市町村'])||''),
      lat:num(pick(o,['lat','latitude','緯度']))??NaN,lng:num(pick(o,['lng','lon','longitude','経度']))??NaN,type:String(pick(o,['type','種別'])||''),
      u:/宿泊者限定|🔴|2/.test(use)?2:/条件|🟡|1/.test(use)?1:0,fee:num(pick(o,['fee','price','料金','入浴料'])),sT:num(pick(o,['saunaTemp','sauna_temp','sT','サウナ温度'])),wT:num(pick(o,['waterTemp','water_temp','wT','水風呂温度'])),
      g:bool(pick(o,['outdoor','gaiki','外気浴','hasOutdoor'])),l:bool(pick(o,['loyly','selfLoyly','ロウリュ','セルフロウリュ'])===null?null:pick(o,['loyly','selfLoyly','ロウリュ','セルフロウリュ'])),note:String(pick(o,['note','memo','備考','description','特徴'])||'')});n++;
  });
  save();toast(n+'件を追加しました');closeM('m2');
}

render();
</script>
</body>
</html>
